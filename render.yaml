services:
  - type: web
    name: findyourcrib-api
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm install && npm run build --workspace backend
    startCommand: npm run start:prod --workspace backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: property-media
